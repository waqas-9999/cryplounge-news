services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cryplounge
      POSTGRES_PASSWORD: cryplounge
      POSTGRES_DB: cryplounge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cryplounge']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://cryplounge:cryplounge@postgres:5432/cryplounge?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: 10485760
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      THROTTLE_TTL_SECONDS: 60
      THROTTLE_LIMIT: 120
      SWAGGER_ENABLED: 'false'
    volumes:
      - uploads:/app/uploads
    ports:
      - '4000:4000'

volumes:
  postgres_data:
  uploads:
